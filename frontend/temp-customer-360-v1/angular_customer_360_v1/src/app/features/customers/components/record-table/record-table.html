<article class="record-panel">@if(rows().length){<div class="table-wrap"><table><thead><tr>@for(column of columns();track column){<th>{{label(column)}}</th>}</tr></thead><tbody>@for(row of rows();track $index){<tr>@for(column of columns();track column){<td>{{display(row[column])}}</td>}</tr>}</tbody></table></div>}@else{<div class="empty">No records are available for this section.</div>}</article>
